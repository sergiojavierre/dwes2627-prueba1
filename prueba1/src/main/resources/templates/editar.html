<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Actualizar plato</title>
</head>
<body>
<div th:replace="~{components/nav :: nav}"></div>

<h1>Actualizar plato</h1>
<form method="post" th:action="@{/platos/actualizar}">
    <label for="nombre">Nombre:</label>
    <input id="nombre" name="nombre" th:value="${plato.nombre}" readonly>
    <label for="precio">Precio (€):</label>
    <input id="precio" name="precio" type="number" step="0.01" min="0"
           th:value="${plato.precio}" required>
    <button type="submit">Actualizar plato</button>
</form>
</body>
</html>
